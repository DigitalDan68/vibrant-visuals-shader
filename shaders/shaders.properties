oldHandLight=true
separateAo=true
beacon.beam.depth=true
rain.depth=false
particles.ordering=mixed
occlusion.culling=true
frustum.culling=true
oldLighting=false

#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif


#if MC_VERSION < 12111
program.world-1/gbuffers_line.enabled=false
program.world0/gbuffers_line.enabled=false
program.world1/gbuffers_line.enabled=false
#endif

#if MC_VERSION < 11700 || !defined IS_IRIS || !defined ENABLE_SKY
program.world0/gbuffers_clouds.enabled=false
program.world0/gbuffers_skybasic.enabled=false
#endif
# Resource-pack maps can override integrated materials in either mode.
normalMapEnabled=true
specularMapEnabled=true

# DH terrain receives nearby shadows; distant shadow casting is intentionally disabled.
#ifdef DISTANT_HORIZONS
dhShadow.enabled=false
# Material metadata must not be alpha-blended with surfaces behind DH water.
blend.dh_water.colortex5=off
blend.dh_water.colortex6=off
blend.dh_water.colortex7=off
#endif

screen.MATERIALS_SCREEN=GLASS_REFLECTION_STRENGTH MATERIAL_MODE PORTAL_EMISSION INTEGRATED_EMISSION INTEGRATED_METALS LABPBR_METAL_FACTOR LABPBR_SPECULAR_STRENGTH [LABPBR_SCREEN] [PACK_COMPATIBILITY_SCREEN]
screen.GRADING_SCREEN=COLOR_GRADING SUNSET_BLOOM_BOOST EXPOSURE AUTO_EXPOSURE EXPOSURE_MIN EXPOSURE_MAX EXPOSURE_SPEED BLOOM_STRENGTH BLOOM_RADIUS SUN_BLOOM_STRENGTH

# Preserve particle sprite opacity in both Iris particle passes.

# Half-resolution HDR bloom buffer; scene color remains HDR until final.
size.buffer.colortex4=0.5 0.5

# Surface normal and class are discrete metadata, including water.
blend.gbuffers_water.colortex6=off
blend.gbuffers_water.colortex7=off

# Persistent scene-metered exposure, updated once per frame.
size.buffer.colortex3=1 1

screen.SIFT_SCREEN=SIFT_LIGHT_SHAFTS SIFT_MOTES SIFT_AMBIENCE SIFT_FOG_DISTANCE SIFT_MIST_HEIGHT SIFT_SKY_GLOW SIFT_GLOW

# Bind the original End sky independently of cloud-shadow settings.
customTexture.endSkyTex=minecraft:textures/environment/end_sky.png
#ifdef CLOUD_SHADOWS
customTexture.cloudShadowTex=minecraft:textures/environment/clouds.png
#endif

# Preserve emissive beacon beam opacity and discrete surface metadata.
beacon.beam.depth=true
blend.gbuffers_beaconbeam.colortex5=off
blend.gbuffers_beaconbeam.colortex6=off
blend.gbuffers_beaconbeam.colortex7=off

# Native entity render types select blending and preserve texture opacity.
alphaTest.gbuffers_basic=off
blend.gbuffers_basic.colortex1=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_basic.colortex5=off
blend.gbuffers_basic.colortex6=off
blend.gbuffers_basic.colortex7=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex5=off
blend.gbuffers_entities.colortex6=off
blend.gbuffers_entities.colortex7=off
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_entities_translucent.colortex5=off
blend.gbuffers_entities_translucent.colortex6=off
blend.gbuffers_entities_translucent.colortex7=off
blend.gbuffers_water.colortex2=off
blend.dh_water.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off

# Use Iris native End-flash event data for the sky rift.
#ifdef END_FLASH_SKY
endFlashShadows=true
#else
endFlashShadows=false
#endif

# Protect visible particle/portal overlays from procedural sky replacement.
blend.gbuffers_particles.colortex7=off
blend.gbuffers_particles_translucent.colortex7=off

# Keep precipitation translucent even when the native weather render type changes.
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured=SRC_ALPHA ONE ONE ONE_MINUS_SRC_ALPHA

screen.LABPBR_SCREEN=LABPBR_NORMAL_STRENGTH LABPBR_ROUGHNESS_SCALE LABPBR_AO_STRENGTH LABPBR_EMISSION_STRENGTH
screen.LIGHTING_SCREEN=LAMB_DYNAMIC_LIGHTS CAVE_AMBIENT [SHADOWS_SCREEN] [REFLECTIONS_SCREEN] HAND_DYNAMIC_LIGHTING SSAO_STRENGTH SKY_REFLECTIONS
screen.CAUSTICS_SCREEN=WATER_CAUSTICS CAUSTICS_SCALE CAUSTICS_SPEED CAUSTICS_POWER CAUSTICS_PIXELS
screen.WATER_FOG_SCREEN=WATER_CDOM WATER_CHLOROPHYLL WATER_SEDIMENT WATER_BIOME_COLOR WATER_VOLUMETRICS WATER_LIGHT_SHAFTS WATER_VOLUMETRIC_SAMPLES WATER_FOG_DENSITY WATER_SCATTERING
screen.DIMENSIONS_SCREEN=[NETHER_SCREEN] [END_SCREEN] [SIFT_SCREEN] DIMENSION_VOLUMETRICS DIMENSION_FOG_STRENGTH
screen.NETHER_SCREEN=NETHER_FOG_DISTANCE NETHER_AMBIENCE
screen.END_SCREEN=END_FOG_DISTANCE END_AMBIENCE END_SKY_GLOW END_FLASH_SKY END_FLASH_STRENGTH
screen.PERFORMANCE_SCREEN=SSAO_SAMPLES VOLUMETRIC_SAMPLES WATER_VOLUMETRIC_SAMPLES shadowMapResolution shadowDistance SSR_MAX_STEPS SSR_BINARY_STEPS SSR_STEP_SIZE entityShadowDistanceMul

#if COLOR_GRADING == 0
program.world0/composite.enabled=false
program.world0/composite2.enabled=false
program.world-1/composite.enabled=false
program.world-1/composite2.enabled=false
program.world1/composite.enabled=false
program.world1/composite2.enabled=false
program.world_sift/composite.enabled=false
program.world_sift/composite2.enabled=false
#endif

blend.gbuffers_terrain.colortex1=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities_translucent.colortex1=off
blend.gbuffers_hand.colortex1=off

shadowTranslucent=true
blend.shadow=off
# The shadow shader tests texture coverage itself. Output alpha marks glass,
# so Iris must not reject opaque casters whose marker alpha is zero.
alphaTest.shadow=off

# Water volume is composited in final; zero surface alpha must still write depth/material metadata.
alphaTest.gbuffers_water=off
alphaTest.dh_water=off

customTexture.waterCausticTex=textures/water_caustics.png



program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false


# Lightning is fullbright layered geometry; accumulate its luminous core.
alphaTest.gbuffers_lightning=off
blend.gbuffers_lightning=SRC_ALPHA ONE ONE ONE
blend.gbuffers_lightning.colortex1=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_lightning.colortex5=off
blend.gbuffers_lightning.colortex6=off
blend.gbuffers_lightning.colortex7=off


screen.PACK_COMPATIBILITY_SCREEN=PACK_OUTLINE_MARKERS PACK_FULLBRIGHT_ENTITIES
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_hand_water.colortex5=off
blend.gbuffers_hand_water.colortex6=off
blend.gbuffers_hand_water.colortex7=off

# Cloud opacity fades continuously; no alpha-test contour in the sky.
alphaTest.gbuffers_clouds=off

# Held enchantment glint detection; cleared each frame, separate from mob lighting.
image.enchantedHeldImage=enchantedHeldSampler red_integer r32ui unsigned_int true false 1 1
uniform.float.vvDryBiomeDust=smooth(731, if(biome_precipitation == 0 && biome != BIOME_SAVANNA && biome != BIOME_SAVANNA_PLATEAU && biome != BIOME_WINDSWEPT_SAVANNA, rainStrength, 0.0), 3.0, 3.0)


dhClouds=on
uniform.float.vvRedSandBiome=smooth(732, if(biome_category == 4, 1.0, 0.0), 3.0, 3.0)

uniform.float.vvBiomeDesert=smooth(740, if(biome_category == 12, 1.0, 0.0), 3.0, 3.0)

uniform.float.vvBiomeMesa=smooth(741, if(biome_category == 4 || biome == BIOME_SAVANNA || biome == BIOME_SAVANNA_PLATEAU || biome == BIOME_WINDSWEPT_SAVANNA, 1.0, 0.0), 3.0, 3.0)

uniform.float.vvBiomeSwamp=smooth(742, if(biome_category == 14, 1.0, 0.0), 3.0, 3.0)

uniform.float.vvBiomeJungle=smooth(743, if(biome_category == 3, 1.0, 0.0), 3.0, 3.0)

uniform.float.vvBiomeSnow=smooth(744, if(biome_category == 7, 1.0, 0.0), 3.0, 3.0)

#ifdef BIOME_PALE_GARDEN
uniform.float.vvPaleGarden=smooth(750, if(biome == BIOME_PALE_GARDEN, 1.0, 0.0), 3.0, 3.0)
#else
uniform.float.vvPaleGarden=0.0
#endif
# Shadow color is material metadata; opaque casters must overwrite glass transmission.
blend.shadow=off

# Tiled normal texture for image-based water waves.
customTexture.waterWaveTex=textures/water_wave_normal.png

# Source used to identify Particle Rain sprites in the particle atlas.
customTexture.particleRainSource=textures/particle_rain_reference.png

customTexture.animatedEmissionBounds=textures/animated_emission_bounds.png
